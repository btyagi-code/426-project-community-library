services:
  catalog-service:
    build: ./catalog-service
    ports:
      - "3001:3000"

  catalog-ambassador:
    build: ./catalog-ambassador
    ports:
      - "3002:3000"
    environment:
      - CATALOG_SERVICE_URL=http://catalog-service:3000
    depends_on:
      catalog-service:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway-service-1:
    build: ./gateway-service
    environment:
      - CATALOG_SERVICE_URL=http://catalog-ambassador:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      catalog-ambassador:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway-service-2:
    build: ./gateway-service
    environment:
      - CATALOG_SERVICE_URL=http://catalog-ambassador:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      catalog-ambassador:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway-service-3:
    build: ./gateway-service
    environment:
      - CATALOG_SERVICE_URL=http://catalog-ambassador:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      catalog-ambassador:
        condition: service_healthy
      redis:
        condition: service_healthy

  lending-service:
    builld: ./lending-service
    ports:
      - "3003:3003"

  caddy:
    image: caddy:2-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      gateway-service-1:
        condition: service_healthy
      gateway-service-2:
        condition: service_healthy
      gateway-service-3:
        condition: service_healthy
