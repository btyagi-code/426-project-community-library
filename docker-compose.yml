services:
  catalog-service:
    build: ./catalog-service
    ports:
      - "3001:3000"

  catalog-ambassador:
    build: ./catalog-ambassador
    ports:
      - "3002:3000"
    environment:
      - CATALOG_SERVICE_URL=http://catalog-service:3000
    depends_on:
      catalog-service:
        condition: service_healthy

  gateway-service:
    build: ./gateway-service
    ports:
      - "3000:3000"
    environment:
      - CATALOG_SERVICE_URL=http://catalog-ambassador:3000
    depends_on:
      catalog-ambassador:
        condition: service_healthy