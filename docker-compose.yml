services:
  catalog-service:
    build: ./catalog-service
    ports:
      - "3001:3000"

  gateway-service:
    build: ./gateway-service
    ports:
      - "3000:3000"
    environment:
      - CATALOG_SERVICE_URL=http://catalog-service:3000
    depends_on:
      catalog-service:
        condition: service_healthy