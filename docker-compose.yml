services:
  catalog-service:
    build: ./catalog-service
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  catalog-ambassador:
    build: ./catalog-ambassador
    ports:
      - "3002:3000"
    environment:
      - CATALOG_SERVICE_URL=http://catalog-service:3000
    depends_on:
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  gateway-service-1:
    build: ./gateway-service
    environment:
      - CATALOG_SERVICE_URL=http://catalog-ambassador:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      catalog-ambassador:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway-service-2:
    build: ./gateway-service
    environment:
      - CATALOG_SERVICE_URL=http://catalog-ambassador:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      catalog-ambassador:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway-service-3:
    build: ./gateway-service
    environment:
      - CATALOG_SERVICE_URL=http://catalog-ambassador:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      catalog-ambassador:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  lending-service:
    build: ./lending-service
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  holds-service:
    build: ./holds-service
    ports:
      - "3004:3002"
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  notification-worker:
    build: ./notification-worker
    ports:
      - "3005:3000"
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - FAULT_MODE=none
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      gateway-service-1:
        condition: service_healthy
      gateway-service-2:
        condition: service_healthy
      gateway-service-3:
        condition: service_healthy